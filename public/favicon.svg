<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#111921"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#00fff0"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00dbb8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="102" fill="url(#bg)"/>
  <g transform="translate(256,256) scale(1.4) translate(-256,-256) translate(0,-65)">
    <path d="M360,200 A155,155 0 1,1 150,200" 
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
    <polygon points="290,148 188,330 260,330 222,496 332,296 260,296" 
             fill="#00f5d4" filter="url(#glow)" opacity="0.7"/>
    <polygon points="290,148 188,330 260,330 222,496 332,296 260,296" fill="url(#cyan)"/>
    <polygon points="284,178 204,326 260,326 230,468 322,302 262,302" 
             fill="#80fff0" opacity="0.25"/>
  </g>
</svg>